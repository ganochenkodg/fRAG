appId: com.electron.app
productName: frag
directories:
  output: dist
  buildResources: build
extraResources:
  - from: models
    to: models
asarUnpack:
  - resources/**
  - '**/*.dylib'
  - '**/*.so*'
  - '**/*.dll'
win:
  executableName: frag
  files:
    - '!**/.git/**'
    - '!**/.vscode/**'
    - '!src/**'
    - '!dist/**'
    - '!build/**'
    - '!models/**'
    - '!logo/**'
    - '!screenshots/**'
    - '!eu_complete_climate_guide.pdf'
    - '!electron.vite.config.{js,ts,mjs,cjs}'
    - '!svelte.config.mjs'
    - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,LICENSE}'
    - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
    - '!node_modules/onnxruntime-web/**'
    - '!node_modules/onnxruntime-node/bin/napi-v3/darwin/**'
    - '!node_modules/onnxruntime-node/bin/napi-v3/linux/**'
    - '!node_modules/@img/*darwin*/**'
    - '!node_modules/@img/*linux*/**'
    - '!node_modules/@napi-rs/*darwin*/**'
    - '!node_modules/@napi-rs/*linux*/**'
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
  files:
    - '!**/.git/**'
    - '!**/.vscode/**'
    - '!src/**'
    - '!dist/**'
    - '!build/**'
    - '!models/**'
    - '!logo/**'
    - '!screenshots/**'
    - '!eu_complete_climate_guide.pdf'
    - '!electron.vite.config.{js,ts,mjs,cjs}'
    - '!svelte.config.mjs'
    - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,LICENSE}'
    - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
    - '!node_modules/onnxruntime-web/**'
    - '!node_modules/onnxruntime-node/bin/napi-v3/linux/**'
    - '!node_modules/onnxruntime-node/bin/napi-v3/win32/**'
    - '!node_modules/@img/*linux*/**'
    - '!node_modules/@img/*win32*/**'
    - '!node_modules/@napi-rs/*linux*/**'
    - '!node_modules/@napi-rs/*win32*/**'
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
  syncDesktopName: true
  maintainer: electronjs.org
  category: Utility
  files:
    - '!**/.git/**'
    - '!**/.vscode/**'
    - '!src/**'
    - '!dist/**'
    - '!build/**'
    - '!models/**'
    - '!logo/**'
    - '!screenshots/**'
    - '!eu_complete_climate_guide.pdf'
    - '!electron.vite.config.{js,ts,mjs,cjs}'
    - '!svelte.config.mjs'
    - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,LICENSE}'
    - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
    - '!node_modules/onnxruntime-web/**'
    - '!node_modules/onnxruntime-node/bin/napi-v3/darwin/**'
    - '!node_modules/onnxruntime-node/bin/napi-v3/win32/**'
    - '!node_modules/@img/*darwin*/**'
    - '!node_modules/@img/*win32*/**'
    - '!node_modules/@napi-rs/*darwin*/**'
    - '!node_modules/@napi-rs/*win32*/**'
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
